
name: Daily Maintenance

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "sanskarmangla005"
          git config user.email "agrawalsanskar60@gmail.com"

      - name: Update maintenance date
        run: |
          echo "Last maintenance: $(date -u)" > .github/maintenance.txt

      - name: Commit changes
        run: |
          git add .github/maintenance.txt
          git commit -m "chore: daily maintenance" || echo "No changes"
          git push
