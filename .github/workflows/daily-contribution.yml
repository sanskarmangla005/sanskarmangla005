name: Daily Repository Update

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "sanskarmangla005"
          git config user.email "agrawalsanskar60@gmail.com"

      - name: Update file
        run: |
          echo "Repository maintenance: $(date -u)" > daily-update.txt

      - name: Commit changes
        run: |
          git add daily-update.txt
          git commit -m "Update repository maintenance file" || exit 0
          git push
